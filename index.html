<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muro de Mejores Amigos</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background: #020024;
    background: linear-gradient(90deg,rgba(2, 0, 36, 1) 0%, rgba(50, 9, 121, 1) 35%, rgba(123, 8, 255, 1) 100%);
    min-height:100vh;
    padding:30px;
}

h1{
    text-align:center;
    color:white;
    margin-bottom:30px;
    font-size:2.5rem;
}

.wall{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:20px;
}

@media(max-width:1000px){ .wall{ grid-template-columns:repeat(3,1fr); } }
@media(max-width:700px){ .wall{ grid-template-columns:repeat(2,1fr); } }
@media(max-width:500px){ .wall{ grid-template-columns:1fr; } }

.card{
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
    transition:.3s;
}

.card:hover{ transform:scale(1.02); }

.card img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    display:block;
}

.card-content{ padding:12px; }

.card-content p{
    color:#444;
    font-size:14px;
    margin-bottom:10px;
    text-align:center;
}

.delete-btn{
    width:100%;
    border:none;
    background:#351745;
    color:white;
    padding:10px;
    border-radius:12px;
    cursor:pointer;
    font-size:15px;
}

.add-btn{
    position:fixed;
    bottom:30px;
    right:30px;
    width:75px;
    height:75px;
    border-radius:50%;
    border:none;
    font-size:40px;
    background:#ff4f87;
    color:white;
    cursor:pointer;
    box-shadow:0 5px 20px rgba(0,0,0,.3);
}

.add-btn:hover{ transform:scale(1.1); }

input[type=file]{
    display:none;
}
</style>
</head>
<body>

<h1>💖 Nuestro Muro de Mejores Amigos 💖</h1>

<div class="wall" id="wall"></div>

<input type="file" id="fileInput" accept="image/*">
<button class="add-btn" onclick="openGallery()">+</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, push, onValue, remove, query, orderByKey } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDufOv5obzEL7GR941iAveqhQud7Jx1bro",
    authDomain: "fotos-c03f6.firebaseapp.com",
    databaseURL: "https://fotos-c03f6-default-rtdb.firebaseio.com",
    projectId: "fotos-c03f6",
    messagingSenderId: "1027767466212",
    appId: "1:1027767466212:web:ce5626a7c0abac00bc54f1"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const recuerdosRef = ref(db, 'recuerdos');
  const recuerdosQuery = query(recuerdosRef, orderByKey());

  // Escuchar la base de datos gratuita en tiempo real
  onValue(recuerdosQuery, (snapshot) => {
      const wall = document.getElementById("wall");
      wall.innerHTML = ""; 
      const elementos = [];
      
      snapshot.forEach((childSnapshot) => {
          elementos.push({
              key: childSnapshot.key,
              value: childSnapshot.val()
          });
      });

      elementos.reverse().forEach((item) => {
          const idUnico = item.key;
          const memory = item.value;
          
          wall.innerHTML += `
          <div class="card">
              <img src="${memory.image}" alt="Recuerdo">
              <div class="card-content">
                  <p>${memory.text}</p>
                  <button class="delete-btn" data-id="${idUnico}">
                  🗑️ Borrar
                  </button>
              </div>
          </div>
          `;
      });

      document.querySelectorAll('.delete-btn').forEach(btn => {
          btn.addEventListener('click', function() {
              const id = this.getAttribute('data-id');
              deleteMemory(id);
          });
      });
  });

  // Capturar el archivo JPG o PNG seleccionado
  document.getElementById("fileInput").addEventListener("change", function(){
      const file = this.files[0];
      if(!file) return;

      const text = prompt("Escribe un recuerdo ✨") || "💖 Un momento especial";
      
      // Convertir la imagen PNG/JPG a texto Base64 para guardarla gratis
      const reader = new FileReader();
      reader.onloadend = async () => {
          const base64Image = reader.result; // Aquí está tu foto convertida en texto plano

          try {
              // Guardar directo en Realtime Database (100% Gratis)
              await push(recuerdosRef, {
                  image: base64Image,
                  text: text
              });
              
              document.getElementById("fileInput").value = ""; // Limpiar
          } catch (error) {
              console.error(error);
              alert("Error al subir. Asegúrate de tener activa la Realtime Database con sus reglas en 'true'.");
          }
      };
      
      reader.readAsDataURL(file);
  });

  // Eliminar recuerdo de la base de datos
  async function deleteMemory(id){
      if(confirm("¿Quieres borrar este recuerdo?")){
          try {
              const registroRef = ref(db, `recuerdos/${id}`);
              await remove(registroRef);
          } catch (error) {
              alert("No se pudo borrar.");
          }
      }
  }
</script>

<script>
  function openGallery(){
      document.getElementById("fileInput").click();
  }
</script>

</body>
</html>
