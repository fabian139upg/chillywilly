<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muro de Mejores Amigos</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background: #020024;
    background: linear-gradient(90deg,rgba(2, 0, 36, 1) 0%, rgba(50, 9, 121, 1) 35%, rgba(123, 8, 255, 1) 100%);
    min-height:100vh;
    padding:30px;
}

h1{
    text-align:center;
    color:white;
    margin-bottom:30px;
    font-size:2.5rem;
}

/* 4 fotos por fila */
.wall{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:20px;
}

/* responsive */
@media(max-width:1000px){
    .wall{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:700px){
    .wall{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:500px){
    .wall{
        grid-template-columns:1fr;
    }
}

.card{
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
    transition:.3s;
}

.card:hover{
    transform:scale(1.02);
}

/* tamaño fijo uniforme */
.card img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    display:block;
}

.card-content{
    padding:12px;
}

.card-content p{
    color:#444;
    font-size:14px;
    margin-bottom:10px;
    text-align:center;
}

.delete-btn{
    width:100%;
    border:none;
    background:#351745;
    color:white;
    padding:10px;
    border-radius:12px;
    cursor:pointer;
    font-size:15px;
}

.add-btn{
    position:fixed;
    bottom:30px;
    right:30px;
    width:75px;
    height:75px;
    border-radius:50%;
    border:none;
    font-size:40px;
    background:#ff4f87;
    color:white;
    cursor:pointer;
    box-shadow:0 5px 20px rgba(0,0,0,.3);
}

.add-btn:hover{
    transform:scale(1.1);
}

input[type=file]{
    display:none;
}
</style>
</head>
<body>

<h1>💖 Nuestro Muro de Mejores Amigos 💖</h1>

<div class="wall" id="wall"></div>

<input type="file" id="fileInput" accept="image/*">

<button class="add-btn" onclick="openGallery()">+</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
  import { getStorage, ref as storageRef, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

  // 2. CONFIGURACIÓN DE TU PROYECTO (Tomada de tu captura de pantalla)
  const firebaseConfig = {
    apiKey: "AIzaSyBwpFRDEG08ePk7HnAAe8m0a5J7LRvpjZo",
    authDomain: "recuerdos-430a2.firebaseapp.com",
    databaseURL: "https://recuerdos-430a2-default-rtdb.firebaseio.com",
    projectId: "recuerdos-430a2",
    storageBucket: "recuerdos-430a2.firebasestorage.app",
    messagingSenderId: "979657774563",
    appId: "1:979657774563:web:0854f28c5249299a647cd6"
  };

  // Inicializar Firebase
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const storage = getStorage(app);

  // Escuchar la base de datos en tiempo real
  const recuerdosRef = ref(db, 'recuerdos');
  
  onValue(recuerdosRef, (snapshot) => {
      const wall = document.getElementById("wall");
      wall.innerHTML = "";
      
      const data = snapshot.val();
      if (data) {
          // Convertimos el objeto en array y lo invertimos para ver lo más nuevo primero
          Object.keys(data).reverse().forEach((key) => {
              const memory = data[key];
              wall.innerHTML += `
              <div class="card">
                  <img src="${memory.image}" alt="Recuerdo">
                  <div class="card-content">
                      <p>${memory.text}</p>
                      <button class="delete-btn" data-id="${key}" data-storagepath="${memory.storagePath}">
                      🗑️ Borrar
                      </button>
                  </div>
              </div>
              `;
          });

          // Añadir eventos a los botones de borrar creados dinámicamente
          document.querySelectorAll('.delete-btn').forEach(btn => {
              btn.addEventListener('click', function() {
                  const id = this.getAttribute('data-id');
                  const storagePath = this.getAttribute('data-storagepath');
                  deleteMemory(id, storagePath);
              });
          });
      }
  });

  // Función para subir un nuevo recuerdo
  document.getElementById("fileInput").addEventListener("change", async function(){
      const file = this.files[0];
      if(!file) return;

      const text = prompt("Escribe un recuerdo ✨") || "💖 Un momento especial";
      
      // Mostrar un mensaje temporal de "subiendo..."
      alert("Subiendo tu foto... por favor espera un momento.");

      try {
          // 1. Subir la imagen a Firebase Storage con un nombre único basado en el tiempo
          const nombreArchivo = `${Date.now()}_${file.name}`;
          const rutaAlmacenamiento = `fotos/${nombreArchivo}`;
          const fotoRef = storageRef(storage, rutaAlmacenamiento);
          
          await uploadBytes(fotoRef, file);
          
          // 2. Obtener el enlace URL público de la foto subida
          const urlFoto = await getDownloadURL(fotoRef);

          // 3. Guardar en Realtime Database los datos del recuerdo
          await push(recuerdosRef, {
              image: urlFoto,
              text: text,
              storagePath: rutaAlmacenamiento // Guardamos la ruta para poder borrar la foto después
          });

      } catch (error) {
          console.error("Error al subir el recuerdo:", error);
          alert("Hubo un error al subir tu recuerdo. Revisa las reglas de seguridad de tu Firebase.");
      }
  });

  // Función para borrar un recuerdo
  async function deleteMemory(id, storagePath){
      if(confirm("¿Borrar este recuerdo para todos?")){
          try {
              // 1. Borrar la foto de Firebase Storage
              if(storagePath) {
                  const fotoRef = storageRef(storage, storagePath);
                  await deleteObject(fotoRef);
              }
              // 2. Borrar el registro de la Base de Datos
              const registroRef = ref(db, `recuerdos/${id}`);
              await remove(registroRef);
          } catch (error) {
              console.error("Error al borrar:", error);
              alert("No se pudo borrar el elemento.");
          }
      }
  }
</script>

<script>
// Mantener la función de abrir galería accesible desde el botón HTML
function openGallery(){
    document.getElementById("fileInput").click();
}
</script>

</body>
</html>
