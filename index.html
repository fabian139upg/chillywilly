<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muro de Mejores Amigos</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background: #020024;
    background: linear-gradient(90deg,rgba(2, 0, 36, 1) 0%, rgba(50, 9, 121, 1) 35%, rgba(123, 8, 255, 1) 100%);
    min-height:100vh;
    padding:30px;
}

h1{
    text-align:center;
    color:white;
    margin-bottom:30px;
    font-size:2.5rem;
}

/* 4 fotos por fila */
.wall{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:20px;
}

/* responsive */
@media(max-width:1000px){
    .wall{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:700px){
    .wall{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:500px){
    .wall{
        grid-template-columns:1fr;
    }
}

.card{
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
    transition:.3s;
}

.card:hover{
    transform:scale(1.02);
}

/* tamaño fijo uniforme */
.card img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    display:block;
}

.card-content{
    padding:12px;
}

.card-content p{
    color:#444;
    font-size:14px;
    margin-bottom:10px;
    text-align:center;
}

.delete-btn{
    width:100%;
    border:none;
    background:#351745;
    color:white;
    padding:10px;
    border-radius:12px;
    cursor:pointer;
    font-size:15px;
}

.add-btn{
    position:fixed;
    bottom:30px;
    right:30px;
    width:75px;
    height:75px;
    border-radius:50%;
    border:none;
    font-size:40px;
    background:#ff4f87;
    color:white;
    cursor:pointer;
    box-shadow:0 5px 20px rgba(0,0,0,.3);
}

.add-btn:hover{
    transform:scale(1.1);
}

input[type=file]{
    display:none;
}
</style>
</head>
<body>

<h1>💖 Nuestro Muro de Mejores Amigos 💖</h1>

<div class="wall" id="wall"></div>

<input type="file" id="fileInput" accept="image/*">

<button class="add-btn" onclick="openGallery()">+</button>

<script type="module">
  // Importar las herramientas necesarias desde las URLs oficiales de Firebase (CDN)
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, push, onValue, remove, query, orderByKey } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
  import { getStorage, ref as storageRef, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

  // Configuración de las credenciales de tu proyecto de Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyBwpFRDEG08ePk7HnAAe8m0a5J7LRvpjZo",
    authDomain: "recuerdos-430a2.firebaseapp.com",
    databaseURL: "https://recuerdos-430a2-default-rtdb.firebaseio.com",
    projectId: "recuerdos-430a2",
    storageBucket: "recuerdos-430a2.firebasestorage.app",
    messagingSenderId: "979657774563",
    appId: "1:979657774563:web:0854f28c5249299a647cd6"
  };

  // Inicializar los servicios de Firebase
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const storage = getStorage(app);

  // Referencia a la colección "recuerdos" en la base de datos
  const recuerdosRef = ref(db, 'recuerdos');
  
  // Consulta ordenada para traer los datos desde Firebase de forma consistente
  const recuerdosQuery = query(recuerdosRef, orderByKey());

  // Escuchar la base de datos en tiempo real
  onValue(recuerdosQuery, (snapshot) => {
      const wall = document.getElementById("wall");
      wall.innerHTML = ""; // Limpiar el muro antes de renderizar
      
      const elementos = [];
      
      // Recorrer los datos respetando el orden de la consulta
      snapshot.forEach((childSnapshot) => {
          elementos.push({
              key: childSnapshot.key, // ID único del recuerdo (generado por Firebase)
              value: childSnapshot.val() // Objeto con la información (image, text, storagePath)
          });
      });

      // Invertimos el array para que el recuerdo más nuevo aparezca arriba/primero
      elementos.reverse().forEach((item) => {
          const idUnico = item.key;
          const memory = item.value;
          
          wall.innerHTML += `
          <div class="card">
              <img src="${memory.image}" alt="Recuerdo">
              <div class="card-content">
                  <p>${memory.text}</p>
                  <button class="delete-btn" data-id="${idUnico}" data-storagepath="${memory.storagePath}">
                  🗑️ Borrar
                  </button>
              </div>
          </div>
          `;
      });

      // Asignar los eventos de clic a cada botón de borrar generado
      document.querySelectorAll('.delete-btn').forEach(btn => {
          btn.addEventListener('click', function() {
              const id = this.getAttribute('data-id');
              const storagePath = this.getAttribute('data-storagepath');
              deleteMemory(id, storagePath);
          });
      });
  });

  // Evento para capturar cuando se selecciona una foto nueva
  document.getElementById("fileInput").addEventListener("change", async function(){
      const file = this.files[0];
      if(!file) return;

      const text = prompt("Escribe un recuerdo ✨") || "💖 Un momento especial";
      
      alert("Subiendo tu recuerdo a la nube... Por favor espera.");

      try {
          // 1. Crear un nombre único de archivo usando la marca de tiempo actual
          const nombreArchivo = `${Date.now()}_${file.name}`;
          const rutaAlmacenamiento = `fotos/${nombreArchivo}`;
          const fotoRef = storageRef(storage, rutaAlmacenamiento);
          
          // 2. Subir el archivo binario de la imagen a Firebase Storage
          await uploadBytes(fotoRef, file);
          
          // 3. Obtener el enlace URL de descarga pública de la imagen
          const urlFoto = await getDownloadURL(fotoRef);

          // 4. Guardar el registro en la Realtime Database
          await push(recuerdosRef, {
              image: urlFoto,
              text: text,
              storagePath: rutaAlmacenamiento // Guardamos la ruta exacta para poder borrar el archivo físico después
          });

          // Limpiar el input para que permita volver a subir la misma foto si se desea
          this.value = "";

      } catch (error) {
          console.error("Error completo al guardar el recuerdo:", error);
          alert("Hubo un error al subir los datos. Verifica que las reglas de Realtime Database y Storage estén en 'true'.");
      }
  });

  // Función interna para borrar un recuerdo de la nube de forma segura
  async function deleteMemory(id, storagePath){
      if(confirm("¿Estás seguro de que quieres borrar este recuerdo para siempre?")){
          try {
              // 1. Si existe la ruta del archivo, borrar primero la foto física en Storage
              if(storagePath) {
                  const fotoRef = storageRef(storage, storagePath);
                  await deleteObject(fotoRef);
              }
              
              // 2. Borrar el registro del texto y enlace de la Realtime Database usando su ID único
              const registroRef = ref(db, `recuerdos/${id}`);
              await remove(registroRef);
              
          } catch (error) {
              console.error("Error al intentar eliminar de Firebase:", error);
              alert("No se pudo borrar el elemento. Revisa los permisos.");
          }
      }
  }
</script>

<script>
  // Esta función se mantiene global para que el botón HTML pueda llamarla directamente
  function openGallery(){
      document.getElementById("fileInput").click();
  }
</script>

</body>
</html>
